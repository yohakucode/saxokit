<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>saxokit 運用モニター</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171c21'/%3E%3Cpath d='M6 21l6-7 5 4 9-9' fill='none' stroke='%23e9edf1' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // 描画前に配色を確定する(hooks/useTheme.ts と同じ規則)
      (function () {
        var dark = false;
        try {
          var v = localStorage.getItem("saxokit.theme");
          dark = v === "dark" || (v !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {}
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>saxokit 運用モニターの表示には JavaScript が必要です。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
