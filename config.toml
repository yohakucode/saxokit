# saxokit 設定。コストは保守的(悲観)側に倒す。

[costs]
fee_bps = 0.0                 # 片道手数料(FX はスプレッドのみ。CFD で必要なら設定)
spread_bps_fallback = 2.0     # bid/ask の無い商品(指数CFD等)の想定スプレッド
# スワップ(bps/日): 負 = 支払い、正 = 受け取り。出力 swap は正 = 負担。
# 0 のままだとキャリーを無視する。較正手順:
#   1. Saxo API のフォワードカーブ(7/30/91 日)から実勢キャリーを出す
#   2. 証券会社公表のスワップ表からマークアップを推定して加算
#   3. 保守側へ丸める(ロング受取は小さく、ショート支払は大きく)。金利が動いたら再較正
swap_long_bps_per_day = 0.0
swap_short_bps_per_day = 0.0

[backtest]
leverage = 1.0                # 損益・コストに掛ける検証倍率。実口座の上限ではない
is_ratio = 0.7                # IS/OOS = 70/30
